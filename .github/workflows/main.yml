name: Build
on:
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE*"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE*"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        version:
          - { sm_ver: 1.12-dev, sm_label: "1.12" }
          - { sm_ver: master, sm_label: "1.13" }
      fail-fast: false
    runs-on: windows-latest
    name: windows--sm-${{ matrix.version.sm_label }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: project

      - name: Resolve HL2SDK commit
        id: sdk
        working-directory: project
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:hl2sdk-csgo)" >> "$GITHUB_OUTPUT"

      - name: Checkout HL2SDK (CSGO)
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/hl2sdk
          ref: ${{ steps.sdk.outputs.sha }}
          path: project/hl2sdk-csgo
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/
            /lib/public/tier0.lib
            /lib/public/tier1.lib
            /lib/public/mathlib.lib

      - name: Checkout SourceMod
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/sourcemod
          ref: ${{ matrix.version.sm_ver }}
          path: sourcemod
          sparse-checkout: |
            public
            sourcepawn

      - name: Init SourceMod submodules
        working-directory: sourcemod
        run: git submodule update --init --depth 1 public/amtl sourcepawn

      - uses: actions/setup-python@v6
        name: Setup Python
        with:
          python-version: "3.14"

      - name: Install AMBuild
        run: pip install git+https://github.com/alliedmodders/ambuild@01212cb57c96561f664b6dfb2ee10e66de6f81e4

      - name: Build
        working-directory: project
        shell: bash
        run: |
          mkdir build && cd build
          python ../configure.py \
            --sm-path="${{ github.workspace }}/sourcemod" \
            --enable-optimize
          ambuild

      - name: Stage release files
        shell: bash
        run: |
          mkdir -p staging/addons/sourcemod/extensions staging/addons/sourcemod/gamedata staging/addons/sourcemod/scripting/include
          find project/build -name '*.dll' -exec cp {} staging/addons/sourcemod/extensions/ \;
          cp project/gamedata/*.txt staging/addons/sourcemod/gamedata/
          cp project/include/*.inc staging/addons/sourcemod/scripting/include/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bsp-peek-windows--sm-${{ matrix.version.sm_label }}
          path: staging/*

  build-docker:
    strategy:
      matrix:
        runtime:
          - name: steamrt3
            image: ghcr.io/femboykz/build-containers:steamrt3
          - name: steamrt4
            image: ghcr.io/femboykz/build-containers:steamrt4
        version:
          - { sm_ver: 1.12-dev, sm_label: "1.12" }
          - { sm_ver: master, sm_label: "1.13" }
      fail-fast: false
    runs-on: ubuntu-latest
    name: ${{ matrix.runtime.name }}--sm-${{ matrix.version.sm_label }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: project

      - name: Resolve HL2SDK commit
        id: sdk
        working-directory: project
        run: echo "sha=$(git rev-parse HEAD:hl2sdk-csgo)" >> "$GITHUB_OUTPUT"

      - name: Checkout HL2SDK (CSGO)
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/hl2sdk
          ref: ${{ steps.sdk.outputs.sha }}
          path: project/hl2sdk-csgo
          sparse-checkout: |
            public
            lib/linux

      - name: Checkout SourceMod
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/sourcemod
          ref: ${{ matrix.version.sm_ver }}
          path: sourcemod
          sparse-checkout: |
            public
            sourcepawn

      - name: Init SourceMod submodules
        working-directory: sourcemod
        run: git submodule update --init --depth 1 public/amtl sourcepawn

      - name: Build inside container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work/project \
            ${{ matrix.runtime.image }} \
            bash -ec '
              mkdir -p build && cd build
              python3 ../configure.py \
                --sm-path=/work/sourcemod \
                --enable-optimize
              ambuild
            '

      - name: Stage release files
        if: matrix.runtime.name == 'steamrt3'
        run: |
          mkdir -p staging/addons/sourcemod/extensions staging/addons/sourcemod/gamedata staging/addons/sourcemod/scripting/include
          find project/build -name '*.so' -exec cp {} staging/addons/sourcemod/extensions/ \;
          cp project/gamedata/*.txt staging/addons/sourcemod/gamedata/
          cp project/include/*.inc staging/addons/sourcemod/scripting/include/

      - name: Upload artifact
        if: matrix.runtime.name == 'steamrt3'
        uses: actions/upload-artifact@v7
        with:
          name: bsp-peek-linux--sm-${{ matrix.version.sm_label }}
          path: staging/*

  release:
    needs: [build, build-docker]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Zip artifacts
        run: |
          cd artifacts
          for dir in */; do
            (cd "$dir" && zip -r "../../${dir%/}.zip" .)
          done
          cd ..

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --clobber \
              *.zip
          else
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --generate-notes \
              *.zip
          fi
